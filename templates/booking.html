<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><title>Book {{b.name}}</title></head><body class="booking-body"><section class="booking-card"><p class="eyebrow">ONLINE BOOKING</p><h1>{{b.name}}</h1><p class="muted">{{b.trade}}</p><form method="post" class="form-grid"><label>Name<input name="name" required></label><label>Phone<input name="phone" required></label><label>Email<input type="email" name="email"></label><label>Service<select name="service_id">{% for s in services %}<option value="{{s.id}}">{{s.name}} · from {{s.price|money}}</option>{% endfor %}</select></label><label class="full">Address<input name="address" required></label><label>Preferred date/time<input type="datetime-local" name="start_at" required></label><label class="full">What do you need help with?<textarea name="notes"></textarea></label><button>Request booking</button></form><p class="muted small">Booking requests are confirmed by the business. Prices shown are service estimates.</p></section></body></html>
