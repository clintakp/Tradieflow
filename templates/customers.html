{% extends 'base.html' %}{% block content %}<header><div><p class="eyebrow">CRM</p><h1>Customers</h1><p>Customer contact details and service history foundation.</p></div></header><div class="grid2"><section class="panel"><h2>Add customer</h2><form method="post" class="form-grid"><label>Name<input name="name" required></label><label>Phone<input name="phone"></label><label>Email<input name="email" type="email"></label><label>Address<input name="address"></label><label class="full">Notes<textarea name="notes"></textarea></label><button>Add customer</button></form></section><section class="panel"><h2>{{rows|length}} customers</h2>{% for c in rows %}<div class="list-row"><div><b>{{c.name}}</b><small>{{c.phone}} · {{c.email}}<br>{{c.address}}</small></div></div>{% else %}<p class="muted">No customers yet.</p>{% endfor %}</section></div>{% endblock %}
