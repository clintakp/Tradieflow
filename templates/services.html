{% extends 'base.html' %}{% block content %}<header><div><p class="eyebrow">CATALOGUE</p><h1>Services</h1></div></header><div class="grid2"><section class="panel"><h2>Add service</h2><form method="post" class="form-grid"><label>Name<input name="name" required></label><label>Price ex GST<input type="number" step="0.01" name="price" required></label><label>Duration minutes<input type="number" name="duration" value="60"></label><button>Add service</button></form></section><section class="panel"><h2>Service catalogue</h2>{% for s in rows %}<div class="list-row"><div><b>{{s.name}}</b><small>{{s.duration}} min</small></div><b>{{s.price|money}}</b></div>{% else %}<p class="muted">No services yet.</p>{% endfor %}</section></div>{% endblock %}
