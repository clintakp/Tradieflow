{% extends 'base.html' %}{% block content %}<section class="auth-card"><div class="brand big">Tradie<span>Flow</span></div><p class="muted">Run jobs, customers, bookings and invoices in one place.</p><h1>{{mode}}</h1><form method="post">{% if mode=='Create business' %}<label>Your name<input name="name" required></label><label>Business name<input name="business" required></label><label>Trade / service<input name="trade" placeholder="Electrician, cleaner, mobile mechanic..."></label>{% endif %}<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button>{{mode}}</button></form>{% if mode=='Sign in' %}<a href="{{url_for('register')}}">Create a business account</a>{% else %}<a href="{{url_for('login_view')}}">Already have an account?</a>{% endif %}</section>{% endblock %}
