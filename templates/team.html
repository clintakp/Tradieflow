{% extends 'base.html' %}{% block content %}<header><div><p class="eyebrow">ROLE-BASED ACCESS</p><h1>Team</h1></div></header><div class="grid2"><section class="panel"><h2>Add team member</h2><form method="post" class="form-grid"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Role<select name="role">{% for r in roles %}<option>{{r}}</option>{% endfor %}</select></label><label>Temporary password<input type="password" name="password" minlength="6" required></label><button>Add member</button></form></section><section class="panel"><h2>Workspace users</h2>{% for u in rows %}<div class="list-row"><div><b>{{u.name}}</b><small>{{u.email}}</small></div><span class="pill">{{u.role}}</span></div>{% endfor %}</section></div>{% endblock %}
